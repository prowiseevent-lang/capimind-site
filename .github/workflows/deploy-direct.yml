# ============================================================
# CapiMind - Déploiement direct (alternative)
# ============================================================
#
# Alternative: déploie les fichiers statiques directement
# via l'API GitHub (sans peaceiris/actions-gh-pages).
# Utile si le plugin ci-dessus pose problème.
#
# Même configuration: secret DEPLOY_TOKEN requis.
#
# ============================================================

name: Deploy Direct to capimind.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & Build
        run: |
          bun install --frozen-lockfile 2>/dev/null || bun install
          rm -rf out .next
          DEPLOY_TARGET=custom-domain bun run build:static

      - name: Push to capimind-web repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd out
          touch .nojekyll
          git init -q
          git config user.email "deploy@capimind.com"
          git config user.name "CapiMind Deploy Bot"
          git checkout -q -b main
          git add -A
          git commit -q -m "Deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git remote add origin "https://${DEPLOY_TOKEN}@github.com/mohamedbenkacem95-boop/capimind-web.git"
          git push -f -q origin main
          echo "✅ Deployed to capimind.com"

      - name: Trigger Pages build
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${DEPLOY_TOKEN}" \
            "https://api.github.com/repos/mohamedbenkacem95-boop/capimind-web/pages/builds" || true
