name: Deploy to GitHub Pages (public repo)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Temporarily remove API routes (incompatible with static export)
        run: |
          if [ -d "src/app/api" ]; then
            mv src/app/api .api-backup
            echo "Moved src/app/api → .api-backup"
          fi

      - name: Build static site
        env:
          DEPLOY_TARGET: github-pages
        run: bun run build:static

      - name: Restore API routes
        if: always()
        run: |
          if [ -d ".api-backup" ]; then
            mv .api-backup src/app/api
          fi

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Push static build to public repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd out
          git init
          git config user.email "deploy@capimind.com"
          git config user.name "CapiMind Deploy Bot"
          git checkout -b main
          git add -A
          git commit -m "Auto-deploy from CapiMind@${{ github.sha }}"
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/mohamedbenkacem95-boop/capimind-web.git"
          git push -f origin main

      - name: Trigger GitHub Pages build
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${DEPLOY_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mohamedbenkacem95-boop/capimind-web/pages/builds"
          echo "Pages build triggered"
